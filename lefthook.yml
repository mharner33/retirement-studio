pre-commit:
  parallel: true
  jobs:
    - name: ruff format
      run: uv run ruff format --check
    - name: ruff lint
      run: uv run ruff check
    - name: pyright
      run: npx pyright
    - name: pytest
      run: uv run pytest -q
    - name: prettier
      run: npx prettier --check -u dashboard e2e *.config.*
    - name: eslint
      run: npx eslint dashboard e2e *.config.*
    - name: tsc
      run: npx tsc
    - name: vitest
      run: npx vitest run --root dashboard --coverage
